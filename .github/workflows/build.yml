name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp starfront/build/outputs/apk/debug/starfront-debug.apk StarfrontTD-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StarfrontTD-${{ github.run_number }}
          path: StarfrontTD-${{ github.run_number }}.apk

      # A release gives a plain .apk link that's easy to open on the phone
      # (Actions artifacts are zipped and need a GitHub login).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Starfront TD build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Built from ${{ github.ref_name }} @ ${{ github.sha }}
          files: StarfrontTD-${{ github.run_number }}.apk
          make_latest: true
