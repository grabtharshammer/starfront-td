name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon :core:jvmTest testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp starfront/build/outputs/apk/debug/starfront-debug.apk StarfrontTD-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StarfrontTD-${{ github.run_number }}
          path: StarfrontTD-${{ github.run_number }}.apk

      # A release gives a plain .apk link that's easy to open on the phone
      # (Actions artifacts are zipped and need a GitHub login).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Starfront TD build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Built from ${{ github.ref_name }} @ ${{ github.sha }}
          files: StarfrontTD-${{ github.run_number }}.apk
          make_latest: true

  # Checks the iOS app still builds, and packages an unsigned .ipa (sign it on install with
  # Xcode or a sideloading tool). See "iOS" in the README for running it on an iPhone.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build for the simulator
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build

      - name: Build for devices
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R "build/ios/Build/Products/Release-iphoneos/Starfront TD.app" Payload/
          zip -qr StarfrontTD-${{ github.run_number }}-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: StarfrontTD-${{ github.run_number }}-ios
          path: StarfrontTD-${{ github.run_number }}-unsigned.ipa
